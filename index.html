<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CMHR</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      background: #f6f7f9;
      color: #202124;
    }

    main {
      padding: 2rem;
      text-align: center;
    }

    h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(2.5rem, 10vw, 5rem);
      letter-spacing: 0.08em;
    }

    p {
      margin: 0;
      color: #6b7280;
      font-size: 1.1rem;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #111318;
        color: #f3f4f6;
      }

      p {
        color: #9ca3af;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>CMHR</h1>
    <p>网站建设中</p>
  </main>
</body>
</html>
